<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advanced M3U8 Player</title>
    <link
      href="https://vjs.zencdn.net/8.10.0/video-js.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f0f0f;
        color: #eee;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      .input-box {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      #m3u8-url {
        flex: 1;
        min-width: 200px;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #222;
        color: #eee;
      }

      #play-btn {
        padding: 10px 16px;
        border-radius: 6px;
        border: none;
        background: #007bff;
        color: #fff;
        cursor: pointer;
      }

      #play-btn:hover {
        background: #0056b3;
      }

      .video-js {
        width: 100%;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Advanced M3U8 Player</h1>

      <div class="input-box">
        <input
          id="m3u8-url"
          type="text"
          placeholder="https://example.com/stream.m3u8"
          size="80"
        />
        <button id="play-btn">Play</button>
      </div>

      <video
        id="m3u8-player"
        class="video-js vjs-16-9"
        controls
        preload="auto"
      ></video>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const videoEl = document.getElementById("m3u8-player");
        const player = videojs(videoEl, {
          controls: true,
          preload: "auto",
          autoplay: false,
          fluid: true,
        });

        const urlInput = document.getElementById("m3u8-url");
        const playBtn = document.getElementById("play-btn");

        playBtn.addEventListener("click", () => {
          const src = urlInput.value.trim();
          if (!src) {
            alert("Please enter a valid m3u8 URL");
            return;
          }

          player.src({
            src: src,
            type: "application/x-mpegURL",
          });
          player.load();
          player.play().catch((err) => {
            console.error("Playback error:", err);
            alert("Playback failed. Check URL and CORS.");
          });
        });

        urlInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            playBtn.click();
          }
        });
      });
    </script>
  </body>
</html>
